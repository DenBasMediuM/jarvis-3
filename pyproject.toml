[project]
name = "jarvis"
version = "0.1.0"
description = "Local personal assistant with pluggable modules and AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "openai>=1.54.0",
  "cryptography>=43.0.0",
  "python-multipart>=0.0.12",
  "aiosqlite>=0.20.0",
]

[tool.uvicorn]
factory = false