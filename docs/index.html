<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis · Витрина</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared/styles.css?v=20261010-nav-auth3" />
  <script src="./shared/auth.js?v=20261010-nav-auth3" defer></script>
</head>
<body>
  <div class="shell">
    <nav class="shell-nav" aria-label="Витрина">
      <a class="shell-brand" href="./">
        <span class="shell-mark">J</span>
        <span class="shell-brand-text">
          <span class="shell-brand-name">Jarvis</span>
          <span class="shell-brand-sub">витрина</span>
        </span>
      </a>
      <div class="shell-mods"></div>
    </nav>

    <header class="hub-hero">
      <h1>Операционные блоки</h1>
      <p>Качество, процессы и финансы — снимки из локального Jarvis. Вход по выданному логину.</p>
    </header>

    <div class="hub-grid" id="hub-grid"></div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const auth = window.JarvisVitrineAuth;
      if (!auth?.requireAuth()) return;
      const s = auth.session();
      auth.applyShellNav(null);
      const cards = [
        {
          id: "quality",
          href: "./quality/",
          kicker: "Сервис",
          title: "Качество",
          text: "KPI по квитанциям, мастера, динамика сроков и операционный анализ.",
        },
        {
          id: "processes",
          href: "./vyrobotka/",
          kicker: "Операции",
          title: "Процессы",
          text: "Досогласования по неделям и дебиторка: недоплаты и сверка с CRM.",
        },
        {
          id: "finance",
          href: "./finance/",
          kicker: "Скоро",
          title: "Финансы",
          text: "Раздел в подготовке — финансовые отчёты появятся позже.",
          soon: true,
        },
      ];
      const grid = document.getElementById("hub-grid");
      grid.innerHTML = cards
        .filter((c) => auth.canSeeNav(s.access, c.id))
        .map((c) => {
          if (c.soon && c.id === "finance") {
            return `<a class="hub-card" data-mod="${c.id}" href="${c.href}">
              <span class="hub-card-kicker">${c.kicker}</span>
              <h2>${c.title}</h2>
              <p>${c.text}</p>
              <span class="hub-card-cta">Открыть →</span>
            </a>`;
          }
          return `<a class="hub-card" data-mod="${c.id}" href="${c.href}">
            <span class="hub-card-kicker">${c.kicker}</span>
            <h2>${c.title}</h2>
            <p>${c.text}</p>
            <span class="hub-card-cta">Открыть →</span>
          </a>`;
        })
        .join("");
      if (!grid.innerHTML) {
        grid.innerHTML = `<div class="hub-card is-soon"><span class="hub-card-kicker">Доступ</span>
          <h2>Нет разделов</h2><p>В вашей учётной записи не отмечены блоки. Обратитесь к администратору Jarvis.</p>
          <span class="hub-card-cta">—</span></div>`;
      }
    });
  </script>
</body>
</html>
