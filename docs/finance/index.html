<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Финансы · Jarvis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/styles.css?v=20261010-nav-auth1" />
  <script src="../shared/auth.js?v=20261010-nav-auth1" defer></script>
</head>
<body>
  <div class="shell">
    <nav class="shell-nav" aria-label="Витрина">
      <a class="shell-brand" href="../">
        <span class="shell-mark">J</span>
        <span class="shell-brand-text">
          <span class="shell-brand-name">Jarvis</span>
          <span class="shell-brand-sub">витрина</span>
        </span>
      </a>
      <div class="shell-mods"></div>
    </nav>

    <header class="hub-hero">
      <h1>Финансы</h1>
      <p>Раздел в подготовке — финансовые отчёты появятся здесь позже.</p>
    </header>
    <div class="hub-grid">
      <div class="hub-card is-soon" aria-disabled="true">
        <span class="hub-card-kicker">Скоро</span>
        <h2>Пусто</h2>
        <p>Блок зарезервирован. Доступ настраивается в Jarvis → Пользователи витрины.</p>
        <span class="hub-card-cta">—</span>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const auth = window.JarvisVitrineAuth;
      if (!auth?.requireAuth("finance")) return;
      auth.applyShellNav("finance");
    });
  </script>
</body>
</html>
